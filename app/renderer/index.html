<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: bookstudio://book; font-src bookstudio://assets; frame-src bookstudio://reading; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Studio</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <aside id="panel" aria-label="Chapters">
      <div id="panel-search"></div>
      <div id="panel-tabs" role="tablist" aria-label="Panel"></div>
      <div id="panel-body"></div>
      <div id="panel-notes" hidden></div>
      <div id="panel-results" hidden></div>
    </aside>
    <main id="center">
      <header id="toolbar"></header>
      <div id="banner" hidden></div>
      <div id="findbar" hidden></div>
      <div id="formatbar" hidden></div>
      <div id="stage">
        <section id="source" class="view" hidden></section>
        <section id="reading" class="view"></section>
        <section id="edit" class="view" hidden></section>
        <section id="welcome" class="view" hidden></section>
      </div>
      <footer id="statusbar" hidden></footer>
    </main>
    <aside id="report" hidden aria-label="Print report"></aside>
  </div>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>

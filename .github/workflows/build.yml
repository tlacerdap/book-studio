# Builds the installers on all three systems and keeps them as downloadable artifacts of each run.
# The installers are unsigned (see "First launch" in the README).
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  installers:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, files: "release/*.dmg" }
          - { name: Windows, os: windows-latest, files: "release/*.exe" }
          - { name: Linux, os: ubuntu-latest, files: "release/*.AppImage\nrelease/*.deb" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The checker draws pages with a native canvas module. One macOS build holds both Mac architectures, so it needs
      # both binaries, not only the one for the machine it runs on.
      - name: Add the other Mac canvas binary
        if: runner.os == 'macOS'
        run: npm install --no-save --force @napi-rs/canvas-darwin-x64@0.1.100 @napi-rs/canvas-darwin-arm64@0.1.100

      - run: npm run build
      - run: npm run typecheck

      # The tests print real PDFs through Electron, which needs a display on Linux.
      - name: Test
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Build installers
        run: npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: book-studio-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
